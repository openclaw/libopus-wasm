<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">libopus-wasm social card</title>
  <desc id="desc">libopus-wasm: Opus audio for the web platform. WebAssembly bindings for libopus raw-packet encode and decode, in browsers and Node.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d14"/>
      <stop offset="0.55" stop-color="#10131d"/>
      <stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d4aff"/>
      <stop offset="0.4" stop-color="#4f7bff"/>
      <stop offset="0.72" stop-color="#19b6e8"/>
      <stop offset="1" stop-color="#28d6a8"/>
    </linearGradient>
    <linearGradient id="title-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdd5ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#262a36" stroke-width="2"/>

  <!-- wave mark -->
  <g transform="translate(96, 120)">
    <rect x="0"   y="40" width="22" height="56"  rx="11" fill="#6d4aff"/>
    <rect x="34"  y="0"  width="22" height="96"  rx="11" fill="#4f7bff"/>
    <rect x="68"  y="26" width="22" height="70"  rx="11" fill="#19b6e8"/>
    <rect x="102" y="14" width="22" height="82"  rx="11" fill="#28d6a8"/>
  </g>

  <!-- eyebrow -->
  <text x="98" y="288" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="2" fill="#8d96a4">WEBASSEMBLY · LIBOPUS 1.6.1</text>

  <!-- title -->
  <text x="96" y="368" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="86" font-weight="700" fill="url(#title-fill)">libopus-wasm</text>

  <!-- tagline -->
  <text x="98" y="436" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#c9d0db">Opus audio for the web platform</text>

  <!-- install pill -->
  <g transform="translate(96, 482)">
    <rect x="0" y="0" width="560" height="62" rx="14" fill="#05070d" stroke="#1c2030" stroke-width="2"/>
    <text x="26" y="40" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="27" fill="#64748b">$</text>
    <text x="52" y="40" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="27" fill="#e6edf3">npm install libopus-wasm</text>
  </g>

  <!-- decorative full-bleed waveform along the bottom-right -->
  <g transform="translate(96, 588)" opacity="0.95">
    <rect x="0"    y="-8"  width="9" height="8"  rx="4" fill="url(#wave)"/>
    <rect x="16"   y="-22" width="9" height="22" rx="4" fill="url(#wave)"/>
    <rect x="32"   y="-40" width="9" height="40" rx="4" fill="url(#wave)"/>
    <rect x="48"   y="-16" width="9" height="16" rx="4" fill="url(#wave)"/>
    <rect x="64"   y="-30" width="9" height="30" rx="4" fill="url(#wave)"/>
    <rect x="80"   y="-12" width="9" height="12" rx="4" fill="url(#wave)"/>
    <rect x="96"   y="-26" width="9" height="26" rx="4" fill="url(#wave)"/>
    <rect x="112"  y="-44" width="9" height="44" rx="4" fill="url(#wave)"/>
    <rect x="128"  y="-20" width="9" height="20" rx="4" fill="url(#wave)"/>
    <rect x="144"  y="-34" width="9" height="34" rx="4" fill="url(#wave)"/>
  </g>

  <!-- right-side waveform panel -->
  <g transform="translate(720, 150)" opacity="0.96">
    <rect x="0" y="0" width="384" height="330" rx="20" fill="#05070d" stroke="#1c2030" stroke-width="2"/>
    <g transform="translate(40, 165)">
      <rect x="0"   y="-34"  width="14" height="68"  rx="7" fill="#6d4aff"/>
      <rect x="26"  y="-86"  width="14" height="172" rx="7" fill="#4f7bff"/>
      <rect x="52"  y="-58"  width="14" height="116" rx="7" fill="#19b6e8"/>
      <rect x="78"  y="-104" width="14" height="208" rx="7" fill="#28d6a8"/>
      <rect x="104" y="-44"  width="14" height="88"  rx="7" fill="#6d4aff"/>
      <rect x="130" y="-122" width="14" height="244" rx="7" fill="#4f7bff"/>
      <rect x="156" y="-70"  width="14" height="140" rx="7" fill="#19b6e8"/>
      <rect x="182" y="-96"  width="14" height="192" rx="7" fill="#28d6a8"/>
      <rect x="208" y="-40"  width="14" height="80"  rx="7" fill="#6d4aff"/>
      <rect x="234" y="-110" width="14" height="220" rx="7" fill="#4f7bff"/>
      <rect x="260" y="-52"  width="14" height="104" rx="7" fill="#19b6e8"/>
      <rect x="286" y="-78"  width="14" height="156" rx="7" fill="#28d6a8"/>
    </g>
  </g>
</svg>
