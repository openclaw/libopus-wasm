name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.23.4
          - 24.22.1
          - 26.12.1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ matrix.node }}

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.10

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run
      - run: pnpm test:integrations
      - run: pnpm size:check
      - name: Install Chromium
        if: matrix.node == '24.22.1'
        run: pnpm exec playwright install --with-deps chromium
      - name: Test Worker and AudioWorklet integration
        if: matrix.node == '24.22.1'
        run: pnpm exec playwright test
      - name: Test installed package
        run: |
          pnpm --config.ignore-scripts=true pack --out "$RUNNER_TEMP/libopus-wasm.tgz"
          mkdir "$RUNNER_TEMP/libopus-consumer"
          cd "$RUNNER_TEMP/libopus-consumer"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/libopus-wasm.tgz"
          node node_modules/libopus-wasm/scripts/release-smoke.mjs
      - name: Test installed package in Chromium
        if: matrix.node == '24.22.1'
        run: node scripts/browser-smoke.mjs "$RUNNER_TEMP/libopus-consumer"
