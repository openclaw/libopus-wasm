name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version matching a dated CHANGELOG section
        required: true
        type: string
      dry_run:
        description: Validate and verify without publishing
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
      id-token: write
    uses: openclaw/release-workflows/.github/workflows/release-npm-package.yml@v1
    with:
      version: ${{ inputs.version || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      require-signed-tag: true
      strict-checks: true
      ci-check-events: '["push"]'
      node-version: '24.22.1'
      package-manager: pnpm
      package-manager-version: '11.27.1'
      install-command: bash scripts/release-toolchain.sh && pnpm install --frozen-lockfile
      build-command: pnpm build && pnpm test && pnpm typecheck && pnpm docs:build
      smoke-command: node node_modules/libopus-wasm/scripts/release-smoke.mjs
