name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-comparison:
    name: WASM vs native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.8

      - run: pnpm install --frozen-lockfile
      - run: pnpm benchmark
